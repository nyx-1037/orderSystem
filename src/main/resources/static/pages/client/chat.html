<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线客服 - 订单系统</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/client.css">
    <link rel="stylesheet" href="../../css/chat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">订单系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品列表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">购物车</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="orders.html">我的订单</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="chat.html">在线客服</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span id="username">用户</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person"></i> 个人信息</a></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mt-4">
        <div class="row">
            <!-- 左侧聊天列表 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">聊天列表</h5>
                    </div>
                    <div class="list-group list-group-flush" id="chatList">
                        <a href="#" class="list-group-item list-group-item-action" data-type="broadcast" onclick="switchChat('broadcast')">
                            <div class="d-flex align-items-center">
                                <div class="chat-avatar">
                                    <i class="bi bi-broadcast"></i>
                                </div>
                                <div class="ms-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h6 class="mb-0">全站广播</h6>
                                        <small class="text-muted">-</small>
                                    </div>
                                    <p class="mb-0 text-muted small">接收系统公告和活动信息</p>
                                </div>
                            </div>
                        </a>
                        <a href="#" class="list-group-item list-group-item-action active" data-type="service" onclick="switchChat('service')">
                            <div class="d-flex align-items-center">
                                <div class="chat-avatar">
                                    <i class="bi bi-headset"></i>
                                </div>
                                <div class="ms-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h6 class="mb-0">联系客服</h6>
                                        <small class="text-muted" id="serviceUnread"></small>
                                    </div>
                                    <p class="mb-0 text-muted small">咨询商品、订单或售后问题</p>
                                </div>
                            </div>
                        </a>
                        <!-- 动态加载的客服列表 -->
                    </div>
                </div>
            </div>
            
            <!-- 右侧聊天窗口 -->
            <div class="col-md-8">
                <div class="card chat-card">
                    <!-- 聊天头部 -->
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" id="chatTitle">联系客服</h5>
                        <div>
                            <button class="btn btn-sm btn-outline-light" id="refreshBtn">
                                <i class="bi bi-arrow-clockwise"></i> 刷新
                            </button>
                        </div>
                    </div>
                    
                    <!-- 聊天内容区 -->
                    <div class="card-body chat-body" id="chatContent">
                        <div class="text-center mb-3">
                            <button class="btn btn-sm btn-outline-primary" id="loadMoreBtn">
                                <i class="bi bi-arrow-up"></i> 加载更多
                            </button>
                        </div>
                        <div id="messageContainer">
                            <!-- 消息内容将动态加载 -->
                            <div class="system-message">
                                <div class="message-content">欢迎使用在线客服系统，请问有什么可以帮助您的？</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 聊天输入区 -->
                    <div class="card-footer bg-light" id="chatInputArea">
                        <div class="input-group">
                            <textarea class="form-control" id="messageInput" placeholder="请输入消息..." rows="2"></textarea>
                            <button class="btn btn-primary" id="sendBtn">
                                <i class="bi bi-send"></i> 发送
                            </button>
                        </div>
                        <div class="mt-2 text-muted small">
                            <i class="bi bi-info-circle"></i> 提示：按Enter键发送消息，Shift+Enter换行
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 客服选择模态框 -->
    <div class="modal fade" id="selectServiceModal" tabindex="-1" aria-labelledby="selectServiceModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="selectServiceModalLabel">选择客服</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="list-group" id="serviceList">
                        <!-- 客服列表将动态加载 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="../../js/jquery-3.6.0.min.js"></script>
    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/client/chat-client.js"></script>
</body>
</html>
