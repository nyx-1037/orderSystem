<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服聊天 - 七洛商城后台管理端</title>
    <link rel="icon" href="/7L-icon2.png" type="image/png">
    <link rel="stylesheet" href="/css/res/bootstrap.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin-animations.css">
    <link rel="stylesheet" href="/css/float-buttons.css">
    <link rel="stylesheet" href="/css/admin-sidebar.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/res/all.min.css">

<body>
    <!-- 侧边栏切换按钮 (移动端显示) -->
    <button class="sidebar-toggler" type="button" id="sidebarToggle">
        <i class="fas fa-bars"></i>
    </button>

    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <a href="index.html" class="sidebar-logo">
                            <img src="/7L-icon2.png" alt="七洛商城" class="sidebar-logo-img">
                            <span class="sidebar-logo-text">七洛商城后台管理端</span>
                        </a>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                <i class="fas fa-tachometer-alt"></i> 控制台
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="product-list.html">
                                <i class="fas fa-box"></i> 商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="order-list.html">
                                <i class="fas fa-shopping-cart"></i> 订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="user-list.html">
                                <i class="fas fa-users"></i> 用户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="chat.html">
                                <i class="fas fa-comments"></i> 客服聊天
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="syslog-console.html">
                                <i class="fas fa-clipboard-list"></i> 系统日志
                            </a>
                        </li>

                    </ul>
                    <hr class="my-3">
                    <ul class="nav flex-column mb-2">
                        <li class="nav-item">
                            <a class="nav-link" href="/pages/user/profile.html">
                                <i class="fas fa-id-card"></i> 个人信息
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="logoutBtn">
                                <i class="fas fa-sign-out-alt"></i> 退出登录
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">


                <div class="row">
                    <!-- 左侧用户列表 -->
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">用户列表</h5>
                                <div>
                                    <button class="btn btn-sm btn-outline-light" id="refreshUserListBtn">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <div class="input-group p-2">
                                    <input type="text" class="form-control" placeholder="搜索用户..." id="searchUserInput">
                                    <button class="btn btn-outline-secondary" type="button" id="searchUserBtn">
                                        <i class="fas fa-search"></i>
                                    </button>
                                </div>
                                <div class="list-group list-group-flush" id="userChatList">
                                    <a href="#" class="list-group-item list-group-item-action" data-type="broadcast" onclick="switchChat('broadcast')">
                                        <div class="d-flex align-items-center">
                                    <div class="chat-avatar">
                                        <i class="fas fa-broadcast-tower"></i>
                                    </div>
                                    <div class="ms-3">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <h6 class="mb-0">全站广播</h6>
                                            <small class="text-muted">-</small>
                                        </div>
                                        <p class="mb-0 text-muted small">发送系统公告和活动信息</p>
                                    </div>
                                </div>
                                    </a>
                                    <!-- 动态加载的用户列表 -->
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 右侧聊天窗口 -->
                    <div class="col-md-8">
                        <div class="card chat-card">
                            <!-- 聊天头部 -->
                            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                                <h5 class="mb-0" id="chatTitle">选择用户开始聊天</h5>
                                <div>
                                    <button class="btn btn-sm btn-outline-light" id="refreshBtn">
                                        <i class="fas fa-sync-alt"></i> 刷新
                                    </button>
                                    <button class="btn btn-sm btn-outline-light ms-2" id="markReadBtn">
                                        <i class="fas fa-check-double"></i> 标记已读
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 聊天内容区 -->
                            <div class="card-body chat-body" id="chatContent">
                                <div class="text-center mb-3">
                                    <button class="btn btn-sm btn-outline-primary" id="loadMoreBtn">
                                        <i class="fas fa-arrow-up"></i> 加载更多
                                    </button>
                                </div>
                                <div id="messageContainer">
                                    <!-- 消息内容将动态加载 -->
                                    <div class="system-message">
                                        <div class="message-content">请从左侧选择一个用户开始聊天</div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 聊天输入区 -->
                            <div class="card-footer bg-light" id="chatInputArea">
                                <div class="input-group">
                                    <textarea class="form-control" id="messageInput" placeholder="请输入消息..." rows="2"></textarea>
                                    <button class="btn btn-primary" id="sendBtn">
                                        <i class="fas fa-paper-plane"></i> 发送
                                    </button>
                                </div>
                                <div class="mt-2 text-muted small">
                                    <i class="fas fa-info-circle"></i> 提示：按Enter键发送消息，Shift+Enter换行
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="/js/res/jquery.min.js"></script>
    <script src="/js/res/bootstrap.min.js"></script>
    <script src="/js/res/all.min.js"></script>

    <script src="/js/common.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/admin/main.js"></script>
    <script src="/js/admin/chat-admin.js"></script>
</body>
</html>
