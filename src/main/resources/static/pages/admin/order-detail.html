<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情-七洛商城后台管理端</title>
    <link rel="icon" href="/7L-icon2.png" type="image/png">
    <link rel="stylesheet" href="/css/res/bootstrap.min.css">
    <link rel="stylesheet" href="/css/res/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin-animations.css">
    <link rel="stylesheet" href="/css/float-buttons.css">
    <link rel="stylesheet" href="/css/admin-sidebar.css">
</head>
<body>
    <!-- 侧边栏切换按钮 (移动端显示) -->
    <button class="sidebar-toggler" type="button" id="sidebarToggle">
        <i class="fas fa-bars"></i>
    </button>

    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <a href="index.html" class="sidebar-logo">
                            <img src="/7L-icon2.png" alt="七洛商城" class="sidebar-logo-img">
                            <span class="sidebar-logo-text">七洛商城后台管理端</span>
                        </a>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                <i class="fas fa-tachometer-alt"></i> 控制台
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="order-list.html">
                                <i class="fas fa-shopping-cart"></i> 订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="product-list.html">
                                <i class="fas fa-box"></i> 商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="user-list.html">
                                <i class="fas fa-users"></i> 用户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="chat.html">
                                <i class="fas fa-comments"></i> 客服聊天
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="syslog-console.html">
                                <i class="fas fa-clipboard-list"></i> 系统日志
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">


                <!-- 订单详情内容 -->
                <div class="alert alert-success" id="success-message" style="display: none;"></div>
                <div class="alert alert-danger" id="error-message" style="display: none;"></div>
                
                <div id="order-detail-container">
                    <!-- 订单详情将通过JavaScript动态加载 -->
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="sr-only">加载中...</span>
                        </div>
                        <p>正在加载订单详情...</p>
                    </div>
                </div>
                
                <div id="order-actions" class="mt-4 text-right">
                    <!-- 订单操作按钮将通过JavaScript动态加载 -->
                </div>
            </main>
        </div>
    </div>

    <script src="/js/res/jquery.min.js"></script>
    <script src="/js/res/popper.min.js"></script>
    <script src="/js/res/bootstrap.min.js"></script>
    <script src="/js/res/all.min.js"></script>

    <script src="/js/utils.js"></script> <!-- 引入共享工具函数 -->
    <script src="/js/admin/main.js"></script> <!-- 引入管理员端主脚本 -->
    <script src="/js/image-loader.js"></script>
    <script src="/js/admin/order-detail.js"></script>
    <script src="/js/float-buttons.js"></script> <!-- 引入悬浮按钮功能 -->
    
    <!-- 确认操作Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">确认操作</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p id="confirmMessage"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmActionBtn">确认</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
